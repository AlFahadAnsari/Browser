name: Release

# Push a version tag to cut a release:
#   npm version patch && git push --follow-tags
# Or run this workflow manually to check that all three platforms still build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide or block the other.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          # Linux is deliberately not published. The AppImage/deb targets do not
          # package cleanly on the Ubuntu runner, and shipping a download that
          # does not work is worse than not offering one. `npm run dist:linux`
          # still works for anyone building on a Linux machine themselves.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and bundle
        run: npm run build

      - name: Package installers
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # The app ships unsigned, so electron-builder must not go looking for a
          # certificate it will never find.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: ${{ runner.debug == '1' && 'electron-builder' || '' }}

      - name: List what was produced
        if: always()
        shell: bash
        run: ls -lh release 2>/dev/null || echo 'no release/ directory'

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Runs even when one platform failed, so a single broken build never withholds
    # the other installer. Tag pushes only; manual runs are build checks.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled' }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Report platform coverage
        run: |
          set -euo pipefail
          ls -lh artifacts || true
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No installers were produced by any platform."
            exit 1
          fi
          for ext in dmg exe; do
            n=$(find artifacts -maxdepth 1 -name "*.$ext" | wc -l | tr -d ' ')
            if [ "$n" = "0" ]; then
              echo "::warning::No .$ext produced — that platform's build failed."
            else
              echo "$ext: $n file(s)"
            fi
          done

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          GeoBrowser — a lightweight website viewer that always reports the location
          configured in `src/config/location.ts` (Zoo Media, Prabhadevi, Mumbai).

          ### Downloads

          | File | For |
          | --- | --- |
          | `GeoBrowser-*-arm64.dmg` | macOS, Apple Silicon (M1/M2/M3/M4) |
          | `GeoBrowser-*.dmg` | macOS, Intel |
          | `GeoBrowser Setup *.exe` | Windows 10/11 |

          ### First launch

          These builds are unsigned, so your system will ask once:

          - **macOS** — right-click the app, choose **Open**, then confirm.
          - **Windows** — on the SmartScreen prompt choose **More info → Run anyway**.

          Note: this changes what websites read from the browser, not your IP address.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "GeoBrowser $TAG" \
              --notes "$NOTES"
          fi
