name: Release

# Push a version tag to cut a release:
#   npm version 1.0.1 && git push --follow-tags
# Or run this workflow manually to check that all three platforms still build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the results of the other two.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and bundle
        run: npm run build

      - name: Package installers
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # The app ships unsigned, so electron-builder must not go looking for a
          # certificate it will never find.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only tag pushes produce a release; manual runs are build checks only.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List installers
        run: ls -lh artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          GeoBrowser — a lightweight website viewer that always reports the location
          configured in `src/config/location.ts` (Zoo Media, Prabhadevi, Mumbai).

          **Downloads**

          - macOS — `.dmg` (Apple Silicon and Intel)
          - Windows — `.exe` installer
          - Linux — `.AppImage` or `.deb`

          The builds are unsigned. macOS: right-click the app and choose **Open** the
          first time. Windows: **More info → Run anyway** on the SmartScreen prompt.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "GeoBrowser $TAG" \
              --notes "$NOTES"
          fi
