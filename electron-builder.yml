appId: com.zoomedia.geobrowser
productName: GeoBrowser
copyright: Copyright © 2026 Zoo Media

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

asar: true

# Installers are published to GitHub Releases by .github/workflows/release.yml.
publish:
  provider: github
  owner: AlFahadAnsari
  repo: Browser

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # The app is distributed unsigned; CI sets CSC_IDENTITY_AUTO_DISCOVERY=false.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  category: Network
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
