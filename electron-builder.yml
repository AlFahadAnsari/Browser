appId: com.zoomedia.geobrowser
productName: GeoBrowser
copyright: Copyright © 2026 Zoo Media

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

asar: true

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  darkModeSupport: true

win:
  target:
    - nsis

linux:
  category: Network
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
